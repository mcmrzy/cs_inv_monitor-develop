name: Release Android

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS API base URL, for example https://api.example.com/api/v1
        required: true
        type: string
      release_tag:
        description: Existing GitHub release with a locally signed app-release.apk (empty builds AAB)
        required: false
        type: string
      apk_sha256:
        description: Verified SHA-256 of the signed APK to publish
        required: false
        type: string
      relay_images:
        description: Relay the verified Modbus release images over SSH when server GHCR downloads stall
        required: false
        default: false
        type: boolean
      prepare_retry:
        description: Restore image tags from running containers before retrying the failed Modbus deployment
        required: false
        default: false
        type: boolean
      repair_capabilities:
        description: Apply missing Modbus model grants through the deployed API migration runner
        required: false
        default: false
        type: boolean
      inspect_panel_binding:
        description: Read the production Modbus panel bindings and target model settings
        required: false
        default: false
        type: boolean
      repair_modbus_fields:
        description: Add measured fields to empty production Modbus model catalogs
        required: false
        default: false
        type: boolean

jobs:
  build-signed-aab:
    if: inputs.release_tag == '' && !inputs.relay_images && !inputs.prepare_retry && !inputs.repair_capabilities && !inputs.inspect_panel_binding && !inputs.repair_modbus_fields
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate release inputs
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "api_base_url must start with https://" >&2; exit 1 ;;
          esac
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required for a commercial Android release" >&2
              exit 1
            fi
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: stable
          cache: true

      - name: Restore release keystore
        working-directory: inv_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/secure
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/secure/release-keystore.jks

      - name: Build signed AAB
        working-directory: inv_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/inv_app/android/secure/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build appbundle --release \
            --dart-define=API_BASE_URL='${{ inputs.api_base_url }}'

      - name: Verify bundle signing
        working-directory: inv_app
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: inv-app-release-aab
          path: inv_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  publish-signed-apk:
    name: Verify production models and publish signed APK
    if: inputs.release_tag != '' && !inputs.relay_images && !inputs.prepare_retry && !inputs.repair_capabilities && !inputs.inspect_panel_binding && !inputs.repair_modbus_fields
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify release package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9._-]+$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$API_BASE_URL" = 'https://api.jiuxiaoyw.online/api/v1'
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          mkdir package
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir package
          printf '%s  %s\n' "$APK_SHA256" package/app-release.apk | sha256sum -c -
          # Verify the actual signed manifest and signing certificate against the current public release.
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/aapt" dump badging package/app-release.apk > package/badging.txt
          grep -q "package: name='com.csergy.app1' versionCode='44' versionName='1.1.16'" package/badging.txt
          "$BUILD_TOOLS/apksigner" verify --print-certs package/app-release.apk > package/certificate.txt
          curl -fsS 'https://api.jiuxiaoyw.online/api/v1/ota/app/latest?platform=android' > package/current.json
          CURRENT_URL=$(jq -er '.data.download_url | select(startswith("https://download.jiuxiaoyw.online/firmware/apps/android/"))' package/current.json)
          curl -fL --retry 3 "$CURRENT_URL" -o package/previous.apk
          PREVIOUS_SHA=$(jq -er '.data.file_sha256' package/current.json)
          printf '%s  %s\n' "$PREVIOUS_SHA" package/previous.apk | sha256sum -c -
          "$BUILD_TOOLS/apksigner" verify --print-certs package/previous.apk > package/previous-certificate.txt
          NEW_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' package/certificate.txt | tr -d '\r')
          OLD_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' package/previous-certificate.txt | tr -d '\r')
          [[ "$NEW_CERT" =~ ^[a-f0-9]{64}$ && "$OLD_CERT" =~ ^[a-f0-9]{64}$ ]]
          test "$NEW_CERT" = "$OLD_CERT"
          APK_SIZE=$(stat -c %s package/app-release.apk)
          APK_MD5=$(md5sum package/app-release.apk | cut -d' ' -f1)
          MIN_SDK=$(sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" package/badging.txt)
          TARGET_SDK=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" package/badging.txt)
          [[ "$MIN_SDK" =~ ^[0-9]+$ && "$TARGET_SDK" =~ ^[0-9]+$ ]]
          cp deploy/verify-modbus-production.sql package/verify.sql
          python3 - "$APK_SHA256" "$APK_MD5" "$APK_SIZE" "$MIN_SDK" "$TARGET_SDK" <<'PY'
          import pathlib, sys
          sha, md5, size, minimum, target = sys.argv[1:]
          filename = f'com.csergy.app1-1.1.16-44-{sha[:12]}.apk'
          sql = f"""BEGIN;
          SELECT pg_advisory_xact_lock(11644);
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM app_versions WHERE platform='android' AND version_code=44 AND file_sha256<>'{sha}') THEN
              RAISE EXCEPTION 'Version 44 already exists with different content';
            END IF;
            IF EXISTS (SELECT 1 FROM app_versions WHERE platform='android' AND version_code=44
                AND (status<>1 OR COALESCE(is_rolled_back,false) OR rollout_percentage<>100)) THEN
              RAISE EXCEPTION 'Version 44 is rolled back, disabled or not fully released';
            END IF;
            IF EXISTS (SELECT 1 FROM app_versions WHERE platform='android' AND version_code>44 AND status=1 AND NOT COALESCE(is_rolled_back,false)) THEN
              RAISE EXCEPTION 'A newer Android version is already published';
            END IF;
          END $$;
          INSERT INTO app_versions(platform,version_code,version_name,download_url,file_size,file_md5,changelog,
              is_force,min_supported_version,rollout_percentage,status,created_by,file_sha256,package_name,file_name,min_sdk,target_sdk)
          SELECT 'android',44,'1.1.16','/firmware/apps/android/{filename}',{size},'{md5}',
              '新增 Modbus 面板参数总览、蓝牙设置与远程设置；显示数据来源及更新时间，远程写入等待设备确认。',
              false,0,100,1,0,'{sha}','com.csergy.app1','{filename}',{minimum},{target}
          WHERE NOT EXISTS (SELECT 1 FROM app_versions WHERE platform='android' AND version_code=44);
          SELECT version_name,version_code,file_sha256 FROM app_versions WHERE platform='android' AND version_code=44;
          COMMIT;
          """
          pathlib.Path('package/publish.sql').write_text(sql)
          pathlib.Path('package/filename').write_text(filename)
          PY
          rm package/previous.apk
      - name: Publish verified artifact on production
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SOURCE_SHA: ${{ steps.package.outputs.source_sha }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf -v REMOTE_COMMAND 'bash -c %q -- %q %q' "$(cat deploy/publish-modbus-app.sh)" "$SOURCE_SHA" "$APK_SHA256"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf package/publish.tar.gz -C package app-release.apk filename verify.sql publish.sql
          ARCHIVE_SHA=$(sha256sum package/publish.tar.gz | cut -d' ' -f1)
          REMOTE_DIR="/opt/inv-mqtt/.release-relay/$SOURCE_SHA/app/$ARCHIVE_SHA"
          remote="$SERVER_USERNAME@$SERVER_HOST"
          python3 deploy/ssh-upload-chunks.py --file package/publish.tar.gz --remote-dir "$REMOTE_DIR" \
            --host "$remote" --identity ~/.ssh/deploy_key
          printf -v PAYLOAD_COMMAND '%s < %q' "$REMOTE_COMMAND" "$REMOTE_DIR/payload"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$remote" "$PAYLOAD_COMMAND"
          printf -v CLEANUP_COMMAND 'rm -rf -- %q' "$REMOTE_DIR"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$remote" "$CLEANUP_COMMAND"
      - name: Check public release metadata
        env:
          APK_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            curl -fsS "https://api.jiuxiaoyw.online/api/v1/ota/app/latest?platform=android&release_check=$(date +%s)" > package/published.json
            if jq -e --arg sha "$APK_SHA256" '.code == 0 and .data.version_code == 44 and .data.file_sha256 == $sha' package/published.json; then
              break
            fi
            sleep 5
          done
          jq -e --arg sha "$APK_SHA256" '.code == 0 and .data.version_code == 44 and .data.file_sha256 == $sha' package/published.json
          PUBLISHED_URL=$(jq -er '.data.download_url | select(startswith("https://download.jiuxiaoyw.online/firmware/apps/android/"))' package/published.json)
          curl -fL --retry 3 "$PUBLISHED_URL" -o package/published.apk
          printf '%s  %s\n' "$APK_SHA256" package/published.apk | sha256sum -c -

  relay-release-images:
    name: Relay verified release images to production
    if: inputs.relay_images && !inputs.prepare_retry && !inputs.repair_capabilities && !inputs.inspect_panel_binding && !inputs.repair_modbus_fields
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Transfer immutable release images
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          RELEASE_SHA: 536d094df7a25eb46d3a800316adae81dab2aa3f
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          SSH_ARGS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote="$SERVER_USERNAME@$SERVER_HOST"
          ssh "${SSH_ARGS[@]}" "$remote" 'set -eu; df -h /; docker ps --format "{{.Names}} {{.Status}}"; pgrep -af "docker compose.*pull" || true'
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in inv-device-server inv-api-server inv-admin-frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$service:$RELEASE_SHA"
            timeout 180 docker pull "$image"
            expected=$(docker image inspect --format '{{.Id}}' "$image")
            actual=$(ssh "${SSH_ARGS[@]}" "$remote" "docker image inspect --format '{{.Id}}' '$image' 2>/dev/null || true")
            if [ "$expected" = "$actual" ]; then
              echo "Verified image already present; skipping $service"
              continue
            fi
            echo "Relaying $service ($expected)"
            archive="$RUNNER_TEMP/$service-$RELEASE_SHA.tar.gz"
            docker save "$image" | gzip -9 > "$archive"
            archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)
            remote_dir="/opt/inv-mqtt/.release-relay/$RELEASE_SHA/$service/$archive_sha"
            python3 deploy/ssh-upload-chunks.py --file "$archive" --remote-dir "$remote_dir" \
              --host "$remote" --identity ~/.ssh/deploy_key
            printf -v LOAD_COMMAND 'docker load -i %q' "$remote_dir/payload"
            ssh "${SSH_ARGS[@]}" "$remote" "$LOAD_COMMAND"
            actual=$(ssh "${SSH_ARGS[@]}" "$remote" "docker image inspect --format '{{.Id}}' '$image'")
            test "$expected" = "$actual"
            printf -v CLEANUP_COMMAND 'rm -rf -- %q' "$remote_dir"
            ssh "${SSH_ARGS[@]}" "$remote" "$CLEANUP_COMMAND"
            rm -- "$archive"
            echo "Verified image ID: $service"
          done

  prepare-production-retry:
    name: Restore retry baseline from running production images
    if: inputs.prepare_retry && !inputs.repair_capabilities && !inputs.inspect_panel_binding && !inputs.repair_modbus_fields
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Verify running images and restore only image tag settings
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$SERVER_USERNAME@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          baseline=6ccdf93cecaa2accb359400648c1802bc451c43e
          declare -A running_tags
          while read -r container service key; do
            inspected=$(docker inspect --format '{{.State.Running}} {{.Config.Image}}' "$container")
            read -r running image <<< "$inspected"
            test "$running" = true
            prefix="ghcr.io/mcmrzy/$service:"
            [[ "$image" == "$prefix"* ]]
            tag=${image#"$prefix"}
            [[ "$tag" =~ ^[a-f0-9]{40}$ ]]
            running_tags[$key]=$tag
            printf 'Running %s: %s\n' "$container" "$image"
          done <<'SERVICES'
          device-communication inv-device-server IMAGE_TAG_DEVICE
          mqtt-kafka-bridge mqtt-kafka-bridge IMAGE_TAG_BRIDGE
          business-api inv-api-server IMAGE_TAG_API
          api-gateway api-gateway IMAGE_TAG_GATEWAY
          inv-admin-frontend inv-admin-frontend IMAGE_TAG_FRONTEND
          SERVICES
          if [ "${running_tags[IMAGE_TAG_API]}" != "$baseline" ]; then
            echo 'Running API differs from the known previous production release; no configuration changed.' >&2
            exit 1
          fi
          python3 - "$baseline" "${running_tags[IMAGE_TAG_DEVICE]}" "${running_tags[IMAGE_TAG_BRIDGE]}" \
            "${running_tags[IMAGE_TAG_API]}" "${running_tags[IMAGE_TAG_GATEWAY]}" "${running_tags[IMAGE_TAG_FRONTEND]}" <<'PYTHON'
          import fcntl, os, pathlib, re, sys
          keys = ['IMAGE_TAG', 'IMAGE_TAG_DEVICE', 'IMAGE_TAG_BRIDGE', 'IMAGE_TAG_API', 'IMAGE_TAG_GATEWAY', 'IMAGE_TAG_FRONTEND']
          assert len(sys.argv) == len(keys) + 1
          replacements = dict(zip(keys, sys.argv[1:]))
          assert all(re.fullmatch(r'[a-f0-9]{40}', value) for value in replacements.values())
          path = pathlib.Path('/opt/inv-mqtt/deploy/.env.prod')
          with path.open('r+b') as stream:
              fcntl.flock(stream, fcntl.LOCK_EX)
              lines = stream.read().splitlines(keepends=True)
              counts = dict.fromkeys(keys, 0)
              updated = []
              for line in lines:
                  key = line.split(b'=', 1)[0].decode('ascii', errors='replace')
                  if key in replacements:
                      counts[key] += 1
                      ending = b'\r\n' if line.endswith(b'\r\n') else b'\n' if line.endswith(b'\n') else b''
                      line = key.encode() + b'=' + replacements[key].encode() + ending
                  updated.append(line)
              if any(count != 1 for count in counts.values()):
                  raise SystemExit('Expected exactly one line for every image tag; no configuration changed')
              stream.seek(0)
              stream.write(b''.join(updated))
              stream.truncate()
              stream.flush()
              os.fsync(stream.fileno())
          print('Restored six image tag settings from the verified running containers; services and database unchanged.')
          PYTHON
          REMOTE

  repair-modbus-capabilities:
    name: Repair existing Modbus model catalog
    if: (inputs.repair_capabilities || inputs.repair_modbus_fields) && !inputs.inspect_panel_binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Back up and apply migration through production API startup
        env:
          REPAIR_MODBUS_FIELDS: ${{ inputs.repair_modbus_fields }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          mkdir repair-package
          version=138
          filename=138_modbus_panel_capabilities.up.sql
          if [ "$REPAIR_MODBUS_FIELDS" = true ]; then
            version=139
            filename=139_modbus_panel_fields.up.sql
          fi
          cp "database/migrations/$filename" repair-package/
          cp deploy/verify-modbus-production.sql repair-package/verify.sql
          MIGRATION_SHA=$(sha256sum "repair-package/$filename" | cut -d' ' -f1)
          printf -v REMOTE_COMMAND 'bash -c %q -- %q %q' "$(cat deploy/repair-modbus-capabilities.sh)" "$MIGRATION_SHA" "$version"
          tar czf - -C repair-package "$filename" verify.sql | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$SERVER_USERNAME@$SERVER_HOST" "$REMOTE_COMMAND"

  inspect-modbus-binding:
    name: Inspect Modbus model bindings
    if: inputs.inspect_panel_binding && !inputs.repair_modbus_fields
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Query production bindings in a read-only transaction
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          remote_command=$(cat <<'REMOTE'
          docker exec -i inv-postgres sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At'
          REMOTE
          )
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$SERVER_USERNAME@$SERVER_HOST" "$remote_command" \
            < deploy/inspect-modbus-binding.sql
