# 写入生产 .env.prod 凭据，并在 GitHub Runner 上直接调用 ESA OpenAPI 刷新缓存。
# Secrets：ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET / ESA_SITE_ID
name: ESA Config

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh ESA cache from GitHub Runner
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
          ESA_REFRESH_HOST: download.jiuxiaoyw.online
        run: |
          set -e
          echo "Runner DNS check:"
          getent hosts esa.aliyuncs.com || true
          python3 deploy/scripts/esa-refresh.py

      - name: Write credentials into production .env.prod and restart
        uses: appleboy/ssh-action@v1
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: ALIYUN_ACCESS_KEY_ID,ALIYUN_ACCESS_KEY_SECRET,ESA_SITE_ID
          script: |
            set -e
            ENV_FILE=/opt/inv-mqtt/deploy/.env.prod
            test -f "$ENV_FILE"
            sed -i \
              -e '/^ALIYUN_ACCESS_KEY_ID=/d' \
              -e '/^ALIYUN_ACCESS_KEY_SECRET=/d' \
              -e '/^ESA_SITE_ID=/d' \
              -e '/^ESA_CACHE_REFRESH_ENABLED=/d' \
              -e '/^ESA_AUTO_CACHE_RULES=/d' \
              "$ENV_FILE"
            {
              echo "ESA_CACHE_REFRESH_ENABLED=true"
              echo "ESA_AUTO_CACHE_RULES=true"
              echo "ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}"
              echo "ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}"
              echo "ESA_SITE_ID=${ESA_SITE_ID}"
            } >> "$ENV_FILE"
            cd /opt/inv-mqtt/deploy
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate inv-api-server
            sleep 10
            docker inspect -f 'business-api health={{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' business-api
            docker logs --tail 40 business-api 2>&1 | grep -iE 'ESA|error' || true
