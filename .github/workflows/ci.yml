name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-check:
    name: Go Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        module: [business-api, device-communication, api-gateway, mqtt-kafka-bridge]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          # golangci-lint only-new-issues 需要完整历史以计算相对目标分支的增量
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Run Go tests with coverage
        working-directory: ${{ matrix.module }}
        run: go test -race -cover -coverprofile=coverage.out -count=1 ./...
      - name: golangci-lint (PR 增量代码)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
          working-directory: ${{ matrix.module }}
          # 只报告相对目标分支新增的问题；存量债务不阻塞合并
          only-new-issues: true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out

  frontend-check:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: inv-admin-frontend/package-lock.json
      - name: Install
        working-directory: inv-admin-frontend
        run: npm ci
      - name: Lint
        working-directory: inv-admin-frontend
        run: npm run lint
      - name: Type Check
        working-directory: inv-admin-frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: inv-admin-frontend
        run: npm run build
      - name: Run frontend tests with coverage
        working-directory: inv-admin-frontend
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: inv-admin-frontend/coverage/

  flutter-check:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            inv_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('inv_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Pub Get
        working-directory: inv_app
        run: flutter pub get
      - name: Analyze
        working-directory: inv_app
        # Informational style debt remains visible, while warnings and errors
        # are release-blocking (unlike the previous unconditional `|| true`).
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: inv_app
        run: flutter test --coverage --exclude-tags golden
      - name: Upload Flutter coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: inv_app/coverage/lcov.info
      - name: Build unsigned release APK (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: inv_app
        run: flutter build apk --release --dart-define=API_BASE_URL=https://example.invalid/api/v1

  integration-test:
    name: Integration Tests
    needs: [go-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: tests/integration/go.sum
      - name: Start isolated integration environment
        run: docker compose -f deploy/docker-compose.test.yml up -d --build --wait --wait-timeout 300
      - name: Run integration tests
        working-directory: tests/integration
        env:
          TEST_REQUIRE_SERVICES: "true"
        run: go test -v -tags=integration -count=1 ./...
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.test.yml logs --no-color
      - name: Stop integration environment
        if: always()
        run: docker compose -f deploy/docker-compose.test.yml down -v

  e2e-test:
    name: E2E Tests (Playwright)
    needs: [go-check]
    runs-on: ubuntu-latest
    # 2026-09-10 夜间 runner 明显变慢（其余作业时长正常，E2E 在 30m 处被
    # 硬超时取消两次：#334/#336），放宽到 45m 容忍共享 runner 的波动；
    # 真正挂死的测试仍会被这一上限拦住。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: inv-admin-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: inv-admin-frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('inv-admin-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright chromium
        working-directory: inv-admin-frontend
        run: npx playwright install chromium
      - name: Install Playwright system dependencies (only on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install-deps chromium
      - name: Start isolated test stack
        run: docker compose -f deploy/docker-compose.test.yml up -d --build --wait --wait-timeout 300
      - name: Run E2E tests
        working-directory: inv-admin-frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        # 只跑功能项目（setup 作为依赖自动先跑）；visual 截图基线含平台字体
        # 渲染，Linux 基线未种子化前不在 CI 比对，避免跨平台假红
        run: npx playwright test --project=chromium
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.test.yml logs --no-color
      - name: Stop test environment
        if: always()
        run: docker compose -f deploy/docker-compose.test.yml down -v
      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          # Session tokens (auth-storage.json / auth-state.json) and test
          # account credentials (e2e-account.json) must not leave the runner —
          # screenshots/traces only.
          path: |
            e2e_evidence/
            !e2e_evidence/auth-storage.json
            !e2e_evidence/auth-state.json
            !e2e_evidence/e2e-account.json
          retention-days: 14

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: business-api/go.sum
      - name: Run security tests
        run: cd business-api && go test -v -count=1 ./tests/security/...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go modules for reachable vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          for module in business-api device-communication api-gateway mqtt-kafka-bridge; do
            (cd "$module" && govulncheck ./...)
          done
