name: CD - Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-grid-power-schema:
    name: Read-only grid power schema diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production grid power schema
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eu
            docker inspect --format '{{.Config.Image}}' business-api
            docker exec -i inv-postgres sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
            BEGIN READ ONLY;
            SELECT column_name,data_type FROM information_schema.columns WHERE table_name='device_latest_state' AND column_name IN ('device_sn','pv_total_power','ac_active_power','battery_power','battery_soc','ac_input_power','ac_charge_power','updated_at') ORDER BY column_name;
            SELECT version FROM schema_migrations WHERE version=91;
            SELECT d.sn,l.pv_total_power,l.ac_active_power,l.battery_power,l.battery_soc,l.ac_input_power,l.ac_charge_power,l.updated_at FROM devices d JOIN stations s ON s.id=d.station_id JOIN device_latest_state l ON l.device_sn=d.sn WHERE false;
            COMMIT;
            SQL
