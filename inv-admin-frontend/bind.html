<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <title>设备绑定 · 辰烁光伏逆变</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #eef5fb; color: #172b45; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); padding: 36px 28px; border-radius: 20px; background: #fff; box-shadow: 0 12px 36px #16365c18; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { line-height: 1.6; }
      #bind-details { color: #54677d; overflow-wrap: anywhere; }
      a, button { display: block; width: 100%; margin-top: 14px; padding: 13px 16px; border-radius: 10px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
      button { border: 0; color: #fff; background: #1767b5; }
      a { border: 1px solid #cbd9e6; color: #1767b5; background: #fff; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>绑定设备</h1>
      <p id="bind-status" role="status">正在尝试打开辰烁光伏逆变 App…</p>
      <p id="bind-details"></p>
      <button id="open-app" type="button">打开 App 绑定设备</button>
      <a id="download-app" href="/download">前往 App 下载页</a>
    </main>
    <script type="module" src="/src/main-bind.ts"></script>
  </body>
</html>
