# Gradle 8+ 兼容配置
# 加大 Gradle daemon 堆：多模块并行编译 + Kotlin daemon 需要更多内存，2G 会导致
# Kotlin daemon 崩溃 -> 增量缓存损坏 -> 大面积 Unresolved reference
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
# 限制 Kotlin daemon 独立堆，避免与 Gradle daemon / IDE / 模拟器叠加爆内存
kotlin.daemon.jvmargs=-Xmx2048m
# 限制并行编译任务数，降低内存峰值（20+ 插件模块并行时内存压力极大）
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# AGP 9 兼容：builtInKotlin=false 允许 KGP 存在（Flutter 3.44 临时兼容，Issue #183909）
# 根因：Flutter SDK included build (flutter_tools/gradle) 将 KGP 2.0.0 暴露到全局插件 classpath，
# 项目侧无法移除，AGP 9 + builtInKotlin=true 下 FlutterPluginUtils 兜底 apply KGP 必然触发冲突
# 等待 Flutter SDK 修复此问题后可改回 builtInKotlin=true
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 优化资源收缩要求 non-final 资源 ID，但本项目的 App Widget（RemoteViews）
# 依赖 R.id 常量，必须保留 android.nonFinalResIds=false，故先退出优化资源收缩
android.r8.optimizedResourceShrinking=false
