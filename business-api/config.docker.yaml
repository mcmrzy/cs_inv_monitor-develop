server:
  port: 8080
  read_timeout: 30s
  write_timeout: 0s # SSE 长连接需要无写超时
  mode: release

database:
  host: localhost
  port: 5432
  user: postgres
  password: "local-dev-password_STRONG_PASSWORD"
  database: inv_mqtt
  ssl_mode: disable
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

redis:
  host: localhost
  port: 6379
  password: "local-dev-password_STRONG_PASSWORD"
  db: 0

jwt:
  secret: "your-jwt-secret-12345678901234567890123456789012"
  expire_time: 15m
  refresh_expire_time: 168h
  issuer: inv-api-server

sms:
  provider: aliyun
  access_key: ""
  secret_key: ""
  sign_name: ""
  template: ""

email:
  host: smtp.qiye.aliyun.com
  port: 465
  username: ""
  password: ""
  from: ""
  use_ssl: true
  tls_insecure: false  # Never enable in production!
  sender_name: "CSERGY Smart Energy Platform"  # Display name

log:
  level: info
  filename: logs/api-server.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

timezone: Asia/Shanghai

backends:
  device_server: http://localhost:8081
  internal_key: "local-dev-internal-key-1234567890"
  frontend_url: http://192.168.8.50:3000
  upload_dir: ./firmware
  amap_api_key: ""  # 通过环境变量 AMAP_API_KEY 覆盖
  weather_source: open-meteo  # 通过环境变量 WEATHER_SOURCE 覆盖

# 数据库自动迁移配置
# Docker 环境中通过 docker-compose.yml 挂载 database 目录
migration:
  dir: ./database/migrations
  schema_file: ./database/schema.sql
  baseline_version: 22
  auto_run: false

# 极光推送配置 (通过环境变量 JPUSH_* 覆盖)
jpush:
  enabled: false
  app_key: ""
  master_secret: ""
  timeout: 10
  dedup_ttl: 120

# 极光认证（一键登录）配置 (通过环境变量 JVERIFY_* 覆盖)
jverify:
  enabled: false
  rsa_private_key: ""  # PKCS8 base64 私钥，用于解密手机号
  app_key: ""          # 极光认证服务独立 AppKey
  master_secret: ""    # 极光认证服务独立 Master Secret

# RBAC 缓存配置
rbac:
  enabled: false  # Temporarily disabled for local development without Redis

# OTA 升级配置
ota:
  task_timeout_minutes: 30       # 升级任务超时阈值（分钟）：pending/running 任务超过该时长无任何更新自动置为 failed
  task_scan_interval_seconds: 60 # 后台超时扫描间隔（秒）

# Email Queue 配置 (生产环境推荐启用)
email_queue:
  enabled: false  # 开发环境可禁用，生产环境设为 true
  kafka_brokers: ["kafka:9092"]
  topic: "email-sent"
  dlq_topic: "email-dead-letter-queue"
  workers: 5
  batch_size: 50
  batch_timeout: 5s
  max_retries: 3
  rate_limit: 10  # emails per second
