server:
  port: 8081
  read_timeout: 30s
  write_timeout: 30s
  mode: release

database:
  host: postgres
  port: 5432
  user: postgres
  password: "local-dev-password_STRONG_PASSWORD"
  database: inv_mqtt
  ssl_mode: disable
  max_open_conns: 150
  max_idle_conns: 30
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

mqtt:
  broker: broker.jiuxiaoyw.online
  port: 8883
  client_id: CSKJ-INV-DEVICE-SERVER
  username: CSKJ-INV-DEVICE-SERVER
  password: CSKJINVDEVICESERVER
  qos: 1
  # TLS mode — chosen at runtime via env vars (see MQTTConfig docs in internal/config/config.go):
  #   1. MQTT_TLS_SKIP_VERIFY=true → skip ALL certificate verification (DEV/TEST ONLY).
  #      Never use in production.
  #   2. MQTT_TLS_INSECURE=true    → certificate pinning: broker leaf cert is verified
  #      against MQTT_CERT_SHA256 (a valid 64-char hex SHA-256 pin).
  #   3. both false (default)      → standard CA-based TLS verification (port 8883).
  # deploy/.env already sets MQTT_TLS_INSECURE=true + MQTT_CERT_SHA256 for the
  # external EMQX broker; keep both flags false here to avoid config conflicts.
  tls_insecure: false
  cert_sha256: ""
  tls_skip_verify: false

kafka:
  enabled: true
  brokers:
    - jiuxiaoyw.online:9092
  telemetry_topic: inv-telemetry
  alarm_topic: inv-alerts
  command_topic: inv-commands
  consumer_group: inv-device-server-parser
  worker_count: 4

backends:
  api_server: http://inv-api-server:8080
  internal_key: "local-dev-internal-key-1234567890"

log:
  level: info
  filename: logs/device-server.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

timezone: Asia/Shanghai
