name: inv-monitor-test

services:
  postgres:
    image: timescale/timescaledb:latest-pg18
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: inv_test
      TZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - test-pg-data:/var/lib/postgresql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/migration_timescaledb.sql:/docker-entrypoint-initdb.d/02-timescaledb.sql:ro
    networks:
      - inv-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d inv_test"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass testredispass --appendonly yes
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - test-redis-data:/data
    networks:
      - inv-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "testredispass", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.3
    environment:
      EMQX_NAME: emqx-test
      EMQX_HOST: 127.0.0.1
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE: "true"
    ports:
      - "127.0.0.1:11883:1883"
    networks:
      - inv-test-net
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # 测试专用 Kafka（KRaft 单节点），供 device-server 遥测/告警消费链路使用。
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
    ports:
      - "127.0.0.1:19092:9092"
      - "127.0.0.1:39092:29092"
    networks:
      - inv-test-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 25s

  inv-api-server:
    build:
      context: ..
      dockerfile: business-api/Dockerfile
      args:
        GOPROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_NAME: inv_test
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: testredispass
      JWT_SECRET: test-jwt-secret-with-more-than-32-characters
      PRODUCT_SECRET: CS_INV_L10_2026_SECRET
      DEVICE_SERVER_URL: http://inv-device-server:8081
      INTERNAL_KEY: test-internal-key-with-more-than-32-characters
      SERVER_URL: http://api-gateway:8080
      WEATHER_SOURCE: open-meteo
      EMAIL_HOST: smtp.example.com
      JPUSH_ENABLED: "false"
      # schema.sql 基线未包含 096+ 迁移（squash 遗漏），启动时自动补齐；
      # 001-095 已在基线中标记 applied，不会重放
      MIGRATION_AUTO_RUN: "true"
    networks:
      - inv-test-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inv-device-server:
    build:
      context: ../device-communication
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_NAME: inv_test
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: testredispass
      MQTT_BROKER: emqx
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: CSKJ-INV-SERVER-DEVICE-TEST
      KAFKA_ENABLED: "true"
      KAFKA_BROKER: kafka:9092
      KAFKA_TELEMETRY_TOPIC: inv-telemetry
      KAFKA_ALARM_TOPIC: inv-alerts
      KAFKA_COMMAND_TOPIC: inv-commands
      API_SERVER_URL: http://inv-api-server:8080
      INTERNAL_KEY: test-internal-key-with-more-than-32-characters
    networks:
      - inv-test-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inv-api-server:
        condition: service_healthy

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
    environment:
      JWT_SECRET: test-jwt-secret-with-more-than-32-characters
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: testredispass
      API_SERVER_URL: http://inv-api-server:8080
      DEVICE_SERVER_URL: http://inv-device-server:8081
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_NAME: inv_test
      DB_SSL_MODE: disable
    ports:
      - "127.0.0.1:18888:8080"
    networks:
      - inv-test-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inv-api-server:
        condition: service_healthy
      inv-device-server:
        condition: service_healthy

networks:
  inv-test-net:
    driver: bridge

volumes:
  test-pg-data:
  test-redis-data:
