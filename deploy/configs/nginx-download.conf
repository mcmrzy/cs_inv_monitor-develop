# download.jiuxiaoyw.online - 应用下载站点
# 将请求代理到管理后台前端，显示 /download 页面

server {
    listen 80;
    server_name download.jiuxiaoyw.online;

    # 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name download.jiuxiaoyw.online;

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/download.jiuxiaoyw.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.jiuxiaoyw.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 根路径重定向到下载页面
    location = / {
        return 302 /download;
    }

    # 下载页面 - 直接代理到前端
    location /download {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 请求 - 代理到后端获取版本信息
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源
    location /assets/ {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 其他请求都转发到前端（SPA 路由支持）
    location / {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
