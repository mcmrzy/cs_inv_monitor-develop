server {
    listen 80;
    server_name localhost;
    client_max_body_size 200m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker 内部 DNS：周期性重解析上游主机名，避免容器重建后 IP 变化导致 502
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 智能链接绑定中间页（二维码 https://<host>/bind?sn=xxx&pin=xxx）
    location = /bind {
        alias /usr/share/nginx/html/bind.html;
        default_type text/html;
    }

    # App 安装包下载目录（deploy/web/apk/）
    location /apk/ {
        root /usr/share/nginx/html;
        types {
            application/vnd.android.package-archive apk;
        }
    }

    # 前端 SPA 与静态资源统一由 inv-admin-frontend 容器提供
    #（其镜像内置 dist 与缓存/回退策略；本地目录仅保留 bind.html 与 apk）
    location / {
        set $upstream_web http://inv-admin-frontend:8080;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to api-gateway on the internal Docker network
    location /api/ {
        set $upstream_api http://api-gateway:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # SSE 支持：关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket proxy to api-gateway
    location /ws/ {
        set $upstream_ws http://api-gateway:8080;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 固件包与上传文件直连 API Server（绕过网关）
    location ^~ /firmware/ {
        set $upstream_fw http://inv-api-server:8080;
        proxy_pass $upstream_fw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        set $upstream_up http://inv-api-server:8080;
        proxy_pass $upstream_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
