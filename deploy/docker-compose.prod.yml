# ============================================================
# cs_inv_monitor - Production Docker Compose
# EMQX runs externally; Kafka and mqtt-kafka-bridge run in this stack
# ============================================================

name: inv-monitor-prod

services:
  # ---------- PostgreSQL (TimescaleDB) ----------
  postgres:
    image: timescale/timescaledb:latest-pg18
    container_name: inv-postgres
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: inv_mqtt
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores clusters below a version-specific subdirectory.
      - pg-data:/var/lib/postgresql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/migration_timescaledb.sql:/docker-entrypoint-initdb.d/02-timescaledb.sql:ro
    networks:
      - inv-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inv_mqtt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- Redis ----------
  redis:
    image: redis:7.2-alpine
    container_name: inv-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --notify-keyspace-events Ex"]
    networks:
      - inv-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- Kafka (KRaft single node) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: inv-kafka
    hostname: kafka
    ports:
      # Keep the host listener local; application containers use kafka:29092.
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - inv-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- MQTT → Kafka bridge ----------
  mqtt-kafka-bridge:
    image: ghcr.io/mcmrzy/mqtt-kafka-bridge:${IMAGE_TAG:?IMAGE_TAG must be an immutable release tag}
    container_name: mqtt-kafka-bridge
    ports:
      # EMQX is external to this Compose project and posts webhook events here.
      - "18088:18088"
    env_file:
      - .env.prod
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TELEMETRY_TOPIC: ${KAFKA_TELEMETRY_TOPIC:-inv-telemetry}
      KAFKA_ALARM_TOPIC: ${KAFKA_ALARM_TOPIC:-inv-alerts}
      EMQX_TOKEN: ${EMQX_WEBHOOK_TOKEN:-}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - inv-prod-network
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:18088/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- inv-device-server ----------
  inv-device-server:
    image: ghcr.io/mcmrzy/inv-device-server:${IMAGE_TAG:?IMAGE_TAG must be an immutable release tag}
    container_name: device-communication
    expose:
      - "8081"
    env_file:
      - .env.prod
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT}
      KAFKA_BROKER: kafka:29092
      KAFKA_ENABLED: "true"
      API_SERVER_URL: http://inv-api-server:8080
      INTERNAL_KEY: ${INTERNAL_KEY}
    volumes:
      - ./configs/device-server.yaml:/app/config.yaml:ro
      - device-logs:/app/logs
    networks:
      - inv-prod-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inv-api-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- inv-api-server ----------
  inv-api-server:
    image: ghcr.io/mcmrzy/inv-api-server:${IMAGE_TAG:?IMAGE_TAG must be an immutable release tag}
    container_name: business-api
    expose:
      - "8080"
    env_file:
      - .env.prod
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      DEVICE_SERVER_URL: http://inv-device-server:8081
      AMAP_API_KEY: ${AMAP_API_KEY:-a1747dbd3566aa8883fffde623290cd9}  # 高德 Web 服务 Key（缺省用现有 key，可用 .env.prod 覆盖）
      INTERNAL_KEY: ${INTERNAL_KEY}
      SERVER_URL: ${SERVER_URL}
      DOWNLOAD_URL: ${DOWNLOAD_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PRODUCT_SECRET: ${PRODUCT_SECRET}  # 设备 PIN 派生密钥，须与固件/工厂铭牌工具一致
      JPUSH_ENABLED: ${JPUSH_ENABLED:-false}
      JPUSH_APP_KEY: ${JPUSH_APP_KEY}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET}
      JPUSH_TIMEOUT: ${JPUSH_TIMEOUT:-10}
      JPUSH_DEDUP_TTL: ${JPUSH_DEDUP_TTL:-120}
      JVERIFY_ENABLED: ${JVERIFY_ENABLED:-false}
      JVERIFY_APP_KEY: ${JVERIFY_APP_KEY}
      JVERIFY_MASTER_SECRET: ${JVERIFY_MASTER_SECRET}
      JVERIFY_RSA_PRIVATE_KEY: ${JVERIFY_RSA_PRIVATE_KEY}
    volumes:
      - ./configs/api-server.yaml:/app/config.yaml:ro
      - ../database:/app/database:ro  # 挂载数据库迁移文件，启动时自动执行
      - inv-uploads:/data/uploads     # 用户上传持久化（头像/电站图片），容器重建不丢
      - inv-firmware:/data/firmware   # 固件包持久化，容器重建不丢
    networks:
      - inv-prod-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- api-gateway ----------
  api-gateway:
    image: ghcr.io/mcmrzy/api-gateway:${IMAGE_TAG:?IMAGE_TAG must be an immutable release tag}
    container_name: api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.prod
    environment:
      JWT_SECRET: ${JWT_SECRET}
      API_SERVER_URL: http://inv-api-server:8080
      DEVICE_SERVER_URL: http://inv-device-server:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./configs/gateway.yaml:/app/config.yaml:ro
    networks:
      - inv-prod-network
    restart: unless-stopped
    depends_on:
      - inv-api-server
      - inv-device-server
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------- inv-admin-frontend ----------
  inv-admin-frontend:
    image: ghcr.io/mcmrzy/inv-admin-frontend:${IMAGE_TAG:?IMAGE_TAG must be an immutable release tag}
    container_name: inv-admin-frontend
    expose:
      - "80"
    networks:
      - inv-prod-network
    restart: unless-stopped
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: inv-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - inv-nginx-logs:/var/log/nginx  # 访问/错误日志持久化，容器重建不丢
      - /etc/letsencrypt:/etc/letsencrypt:ro  # SSL 证书挂载
      - /var/www/certbot:/var/www/certbot:ro  # ACME 挑战文件
    networks:
      - inv-prod-network
    restart: unless-stopped
    depends_on:
      - inv-admin-frontend
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  inv-prod-network:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  kafka-data:
  device-logs:
  inv-uploads:
  inv-firmware:
  inv-nginx-logs:
