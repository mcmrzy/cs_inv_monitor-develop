# ============================================================
# cs_inv_monitor - Nginx 反向代理（多子域 CDN 模式）
#
# 域名分配：
#   www.jiuxiaoyw.online      → 网站页面（管理后台），保留 /api/ /uploads/ 兼容转发
#   api.jiuxiaoyw.online      → API + WebSocket + SSE + 上传文件（全部走网关）
#   download.jiuxiaoyw.online → 固件大文件下载（仅 /firmware/）
#   jiuxiaoyw.online          → 仅 DNS 直连（MQTT 8883 / Kafka 9092 / App），HTTP(S) 跳转 www
#
# 证书：certbot 签发 *.jiuxiaoyw.online + jiuxiaoyw.online（SAN），
#       统一存放在 /etc/letsencrypt/live/jiuxiaoyw.online/
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 根域 jiuxiaoyw.online：仅 DNS 直连，跳转到 www ----------
server {
    listen 80;
    server_name jiuxiaoyw.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.jiuxiaoyw.online$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jiuxiaoyw.online;

    ssl_certificate /etc/letsencrypt/live/jiuxiaoyw.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuxiaoyw.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.jiuxiaoyw.online$request_uri;
}

# ---------- www：网站页面（管理后台） ----------
server {
    listen 80;
    server_name www.jiuxiaoyw.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.jiuxiaoyw.online;

    ssl_certificate /etc/letsencrypt/live/jiuxiaoyw.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuxiaoyw.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip 压缩：减少传输体积 60-80%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    client_max_body_size 200m;

    location / {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SPA 入口（index.html）要求每次回源校验，保证发版后用户拿到新版本
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # 带 hash 的静态资源：长缓存 + immutable（CDN/浏览器均安全缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp|mp4)$ {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 兼容转发：旧版前端 / 存量数据中的相对路径仍可访问
    # 动态 API 禁止任何缓存（CDN/浏览器），防止列表/统计类接口被边缘缓存吐旧数据
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE support: disable buffering for event streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 用户上传内容可能同 URL 覆盖更新：no-cache 允许缓存但必须回源校验
    location ^~ /uploads/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # 固件文件名含时间戳，内容不可变：可被 CDN/浏览器安全长缓存
    location ^~ /firmware/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

