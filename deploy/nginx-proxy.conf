# ---------- download：App 下载页 + 大文件下载域 ----------
# /                      → App 介绍与下载页（前端 /download 路由）
# /assets/ 与站点图标     → 下载页自身静态资源
# /firmware/             → 固件与 App 安装包文件
# /api/v1/ota/app/latest → 下载页读取最新版本（公开只读，仅放行该端点）
# 其余路径一律 404：下载域不暴露管理后台的其他页面或接口。
server {
    listen 80;
    server_name download.jiuxiaoyw.online 101.43.90.25;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name download.jiuxiaoyw.online 101.43.90.25;

    ssl_certificate /etc/letsencrypt/live/jiuxiaoyw.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuxiaoyw.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    # 固件文件名含时间戳，内容不可变：可被 CDN/浏览器安全长缓存
    location ^~ /firmware/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=31536000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 下载页入口：前端是单页应用，由 SPA 路由 /download 渲染。
    # 根路径必须重定向到 /download —— proxy_pass 只改写发给上游的路径，
    # 浏览器地址仍是 /，SPA 会按 / 路由到后台首页并跳登录页（实测踩过）。
    location = / {
        return 302 /download;
    }

    # SPA 外壳本身（/download 路由）。下载域只开放这一个页面，
    # 其余后台路由落到下面的 404，避免把管理后台暴露在下载域上。
    location = /download {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite 构建产物文件名带内容 hash，可安全长缓存
    location ^~ /assets/ {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=31536000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 浏览器标签页与添加到主屏幕用的站点图标
    location ~ ^/(favicon\.ico|favicon-16x16\.png|favicon-32x32\.png|apple-touch-icon\.png)$ {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, must-revalidate, s-maxage=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 下载页只需读取最新版本；只放行该公开端点，避免把整个 /api/ 暴露在下载域上。
    location = /api/v1/ota/app/latest {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        return 404;
    }
}

