# ============================================================
# cs_inv_monitor - Nginx 反向代理（多子域 CDN 模式）
#
# 域名分配：
#   www.jiuxiaoyw.online      → 网站页面（管理后台），保留 /api/ /uploads/ 兼容转发
#   api.jiuxiaoyw.online      → API + WebSocket + SSE + 上传文件（全部走网关）
#   download.jiuxiaoyw.online → 固件大文件下载（仅 /firmware/）
#   jiuxiaoyw.online          → DNS 直连；/firmware/ 为设备下载，其他 HTTP(S) 跳转 www
#
# 证书：certbot 签发 *.jiuxiaoyw.online + jiuxiaoyw.online（SAN），
#       统一存放在 /etc/letsencrypt/live/jiuxiaoyw.online/
#
# 缓存策略（阿里云 ESA 站点缓存模式设为「优先遵循源站，否则不缓存」时，
# 边缘完全按下面的 Cache-Control 行事；详细说明见 deploy/CACHE_POLICY.md）：
#   /                      → no-cache                      SPA 入口，发版即生效
#   /assets/               → immutable 1y (s-maxage 同)    Vite 产物，文件名带 hash
#   *.png/jpg/.../mp4      → max-age 1d + must-revalidate  固定名静态资源
#   /uploads/              → immutable 1y (s-maxage 同)    后端生成唯一文件名
#   /firmware/             → immutable 1y (s-maxage 同)    固件/App 包，文件名带时间戳
#   /api/                  → no-store                      动态接口与 SSE
#   /ws/                   → no-store                      WebSocket 升级
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 仅供容器健康检查使用：不经过域名跳转、CDN 或上游服务。
server {
    listen 127.0.0.1:8082;
    server_name _;
    access_log off;

    location = /livez {
        default_type text/plain;
        return 200 "ok\n";
    }
}

# ---------- 根域 jiuxiaoyw.online：固件直连源站，其他跳转到 www ----------
server {
    listen 80;
    server_name jiuxiaoyw.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.jiuxiaoyw.online$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jiuxiaoyw.online;

    ssl_certificate /etc/letsencrypt/live/jiuxiaoyw.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuxiaoyw.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # ESP32-C3 firmware uses a 4 KiB MbedTLS receive buffer. Keep response
    # records within that limit; Nginx's 16 KiB default aborts before headers
    # are exposed to esp_http_client (received remains zero).
    ssl_buffer_size 4k;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    # ESP32 OTA 依赖 Content-Length；根域 DNS 直连源站，避免 ESA
    # 将固定长度响应改为 chunked，导致设备在 0% 报 HTTP_ERROR。
    location ^~ /firmware/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering on;
        proxy_request_buffering on;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=31536000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        return 301 https://www.jiuxiaoyw.online$request_uri;
    }
}

# ---------- www：网站页面（管理后台） ----------
server {
    listen 80;
    server_name www.jiuxiaoyw.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.jiuxiaoyw.online;

    ssl_certificate /etc/letsencrypt/live/jiuxiaoyw.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuxiaoyw.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip 压缩：减少传输体积 60-80%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 200m;

    location / {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SPA 入口（index.html）要求每次回源校验，保证发版后用户拿到新版本
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite 构建产物均带内容 hash，可安全长缓存。
    location ^~ /assets/ {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=31536000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 固定文件名图片、图标和字体可能原 URL 覆盖更新，只做短缓存并要求重新验证。
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp|mp4)$ {
        proxy_pass http://inv-admin-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, must-revalidate, s-maxage=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 兼容转发：旧版前端 / 存量数据中的相对路径仍可访问
    # 动态 API 禁止任何缓存（CDN/浏览器），防止列表/统计类接口被边缘缓存吐旧数据
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE support: disable buffering for event streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket 升级请求不得被任何中间层缓存
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # 用户上传文件（头像/电站图/工单附件）由后端生成唯一文件名（uuid+时间戳），
    # 内容不可变，可安全长缓存
    location ^~ /uploads/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=31536000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 固件文件名含时间戳，内容不可变：可被 CDN/浏览器安全长缓存
    location ^~ /firmware/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=31536000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

